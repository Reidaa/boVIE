x-app: &app
  profiles: [workers]

services:
  mysql:
    image: mysql:8.4
    ports: ["127.0.0.1:3306:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-only}
    volumes:
      - mysql:/var/lib/mysql
      - ./deploy/mysql-init.sql:/docker-entrypoint-initdb.d/01-domains.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql -h 127.0.0.1 -u root -e "SELECT 1"']
      interval: 5s
      timeout: 5s
      retries: 30

  nats:
    image: nats:2.11-alpine
    command: ["--config", "/etc/nats/nats.conf"]
    ports: ["127.0.0.1:4222:4222"]
    environment:
      NATS_ADMIN_PASSWORD: ${NATS_ADMIN_PASSWORD:-local-nats-admin}
      NATS_BF_PASSWORD: ${NATS_BF_PASSWORD:-local-nats-bf}
      NATS_WTTJ_PASSWORD: ${NATS_WTTJ_PASSWORD:-local-nats-wttj}
      NATS_NOTIFICATIONS_PASSWORD: ${NATS_NOTIFICATIONS_PASSWORD:-local-nats-notifications}
    volumes:
      - nats:/data/jetstream
      - ./deploy/nats.conf:/etc/nats/nats.conf:ro
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate-bf:
    <<: *app
    build:
      context: .
      target: collector-business-france
    image: bovie-collector-business-france:local
    command: [source-migrate]
    environment:
      DATABASE_URL: mysql+pymysql://business_france:local-bf-only@mysql/business_france
    depends_on:
      mysql: {condition: service_healthy}

  migrate-wttj:
    <<: *app
    build:
      context: .
      target: collector-wttj
    image: bovie-collector-wttj:local
    command: [source-migrate]
    environment:
      DATABASE_URL: mysql+pymysql://wttj:local-wttj-only@mysql/wttj
    depends_on:
      mysql: {condition: service_healthy}

  migrate-notifications:
    <<: *app
    build:
      context: .
      target: discord-intake
    image: bovie-discord-intake:local
    command: [notification-migrate]
    environment:
      DATABASE_URL: mysql+pymysql://notifications:local-notifications-only@mysql/notifications
    depends_on:
      mysql: {condition: service_healthy}

  nats-setup:
    <<: *app
    build:
      context: .
      target: nats-setup
    image: bovie-nats-setup:local
    command: [nats-setup]
    environment:
      NATS_URL: nats://nats:4222
      NATS_USER: admin
      NATS_PASSWORD: ${NATS_ADMIN_PASSWORD:-local-nats-admin}
    depends_on:
      nats: {condition: service_healthy}

  collector-business-france:
    <<: *app
    build:
      context: .
      target: collector-business-france
    image: bovie-collector-business-france:local
    command: [collector-business-france]
    environment:
      DATABASE_URL: mysql+pymysql://business_france:local-bf-only@mysql/business_france
      BOVIE_LIMIT: ${BOVIE_LIMIT:-25}
      BOVIE_REGION: ${BOVIE_REGION:-}
      BOVIE_COUNTRY: ${BOVIE_COUNTRY:-}
      BOVIE_SPECIALIZATION: ${BOVIE_SPECIALIZATION:-}
      NATS_URL: nats://nats:4222
      NATS_USER: business_france
      NATS_PASSWORD: ${NATS_BF_PASSWORD:-local-nats-bf}
    depends_on:
      migrate-bf: {condition: service_completed_successfully}
      nats-setup: {condition: service_completed_successfully}

  collector-wttj:
    <<: *app
    build:
      context: .
      target: collector-wttj
    image: bovie-collector-wttj:local
    command: [collector-wttj]
    environment:
      DATABASE_URL: mysql+pymysql://wttj:local-wttj-only@mysql/wttj
      WTTJ_QUERY: ${WTTJ_QUERY:-}
      WTTJ_CONTRACTS: ${WTTJ_CONTRACTS:-}
      WTTJ_LIMIT: ${WTTJ_LIMIT:-50}
      WTTJ_MAX_PAGES: ${WTTJ_MAX_PAGES:-5}
      NATS_URL: nats://nats:4222
      NATS_USER: wttj
      NATS_PASSWORD: ${NATS_WTTJ_PASSWORD:-local-nats-wttj}
    depends_on:
      migrate-wttj: {condition: service_completed_successfully}
      nats-setup: {condition: service_completed_successfully}

  discord-intake:
    <<: *app
    build:
      context: .
      target: discord-intake
    image: bovie-discord-intake:local
    command: [discord-intake]
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://notifications:local-notifications-only@mysql/notifications
      NATS_URL: nats://nats:4222
      NATS_USER: notifications
      NATS_PASSWORD: ${NATS_NOTIFICATIONS_PASSWORD:-local-nats-notifications}
    depends_on:
      migrate-notifications: {condition: service_completed_successfully}
      nats-setup: {condition: service_completed_successfully}

  discord-sender:
    <<: *app
    build:
      context: .
      target: discord-sender
    image: bovie-discord-sender:local
    command: [discord-sender]
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://notifications:local-notifications-only@mysql/notifications
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    depends_on:
      migrate-notifications: {condition: service_completed_successfully}

volumes:
  mysql:
  nats:
  # Retain the legacy volume declaration; never delete it as part of cutover.
  postgres:
