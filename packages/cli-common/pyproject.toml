[project]
name = "bovie-cli-common"
version = "0.4.0"
requires-python = ">=3.15"
description = "BoVIE cli-common"
dependencies = [
    "click>=8.1.8",
    "loguru>=0.7.3",
    "python-dotenv>=1.0.1"
]

[tool.uv.build-backend]
module-name = "cli_common"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
