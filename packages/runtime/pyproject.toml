[project]
name = "bovie-runtime"
version = "0.4.0"
requires-python = ">=3.13"
description = "BoVIE runtime"
dependencies = [
    "click>=8.1.8",
    "loguru>=0.7.3",
    "python-dotenv>=1.0.1"
]

[tool.uv.build-backend]
module-name = "job_runtime"

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"
