[project]
name = "bovie-discord-intake"
version = "0.4.0"
requires-python = ">=3.13"
description = "BoVIE discord-intake"
dependencies = [
    "click>=8.1.8",
    "loguru>=0.7.3",
    "sqlalchemy>=2.0,<2.1",
    "nats-py>=2.10,<3",
    "bovie-offer-events",
    "bovie-mysql-common",
    "bovie-discord-store",
    "bovie-nats-client",
    "bovie-cli-common"
]

[project.scripts]
discord-intake = "discord_intake.main:main"

[tool.uv.build-backend]
module-name = "discord_intake"

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"
