port: 4222
http_port: 8222
jetstream { store_dir: /data/jetstream }
authorization {
  users: [
    { user: "nats-setup", password: $NATS_SETUP_PASSWORD,
      permissions: { publish: "$JS.API.>", subscribe: "_INBOX.nats-setup.>" } },
    { user: "collector-business-france", password: $NATS_COLLECTOR_BUSINESS_FRANCE_PASSWORD,
      permissions: {
        publish: "offers.business_france.v1",
        subscribe: "_INBOX.collector-business-france.>"
      } },
    { user: "collector-wttj", password: $NATS_COLLECTOR_WTTJ_PASSWORD,
      permissions: { publish: "offers.wttj.v1", subscribe: "_INBOX.collector-wttj.>" } },
    { user: "discord-intake", password: $NATS_DISCORD_INTAKE_PASSWORD,
      permissions: {
        publish: ["$JS.API.CONSUMER.INFO.OFFERS.discord-intake",
                  "$JS.API.CONSUMER.MSG.NEXT.OFFERS.discord-intake",
                  "$JS.ACK.OFFERS.discord-intake.>"],
        subscribe: "_INBOX.discord-intake.>"
      } }
  ]
}
