# Plans .railway/ changes for production and comments the diff on the pull request.
# The apply workflow lands this exact plan after the merge.
name: Railway plan

on:
  pull_request:
    branches: [main]
    paths: [".railway/**"]

permissions:
  contents: read
  pull-requests: write
  # Lets the Railway GitHub App post the plan comment.
  id-token: write

jobs:
  plan:
    # Fork pull requests get no secrets.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Plan Railway production
        uses: railwayapp/config@9e17d413dbe219f19d62538d9c06b5dbb5e9abf8 # v1.2.0
        with:
          command: plan
          # A project token scoped to the production environment.
          railway-token: ${{ secrets.RAILWAY_TOKEN }}
          cli-version: "5.59.0"
