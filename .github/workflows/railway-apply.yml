# Applies the plan that the merged pull request reviewed. It never re-plans:
# if production or .railway/ changed since that plan, the run fails.
# Railway waits for this workflow before it deploys the commit.
name: Railway apply

on:
  push:
    branches: [main]
    paths: [".railway/**"]

permissions:
  contents: read
  actions: read
  # Finds the merged pull request and its saved plan.
  pull-requests: read

concurrency:
  group: railway-apply-production

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Apply Railway production plan
        uses: railwayapp/config@9e17d413dbe219f19d62538d9c06b5dbb5e9abf8 # v1.2.0
        with:
          command: apply
          railway-token: ${{ secrets.RAILWAY_TOKEN }}
          cli-version: "5.59.0"
          # Deletions need a person; see docs/railway.md.
          confirm-destructive: "false"
