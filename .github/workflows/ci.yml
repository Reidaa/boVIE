name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tools from mise.toml
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.8

      - name: Cache Go build and modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-lint-${{ runner.os }}-${{ hashFiles('mise.toml', 'go.sum') }}
          restore-keys: |
            go-lint-${{ runner.os }}-

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l apps packages tests)"
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run golangci-lint
        run: golangci-lint run ./...

      - name: Run go vet
        run: go vet ./...

  tests:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      mysql:
        image: mysql:26.10
        env:
          MYSQL_ROOT_PASSWORD: bovie-test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      MYSQL_TEST_ADMIN_URL: mysql://root:bovie-test-only@127.0.0.1:3306/mysql
      NATS_TEST_URL: nats://127.0.0.1:4222
      NATS_AUTH_TEST_URL: nats://127.0.0.1:4223

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tools from mise.toml
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.8

      - name: Cache Go build and modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-test-${{ runner.os }}-${{ hashFiles('mise.toml', 'go.sum') }}
          restore-keys: |
            go-test-${{ runner.os }}-

      - name: Download Go modules
        run: go mod download

      - name: Start test brokers
        run: |
          docker run -d --name bovie-test-nats -p 127.0.0.1:4222:4222 nats:2.15-alpine --jetstream
          docker create --name bovie-test-nats-auth -p 127.0.0.1:4223:4222 -e NATS_SETUP_PASSWORD=local-nats-setup -e NATS_COLLECTOR_BUSINESS_FRANCE_PASSWORD=local-nats-collector-business-france -e NATS_COLLECTOR_WTTJ_PASSWORD=local-nats-collector-wttj -e NATS_COLLECTOR_WORKDAY_PASSWORD=local-nats-collector-workday -e NATS_DISCORD_INTAKE_PASSWORD=local-nats-discord-intake nats:2.15-alpine --config /tmp/nats.conf
          docker cp deploy/nats.conf bovie-test-nats-auth:/tmp/nats.conf
          docker start bovie-test-nats-auth

      - name: Run tests and verify builds
        run: |
          go test -race -v ./...
          go build ./...

  images:
    name: Build ${{ matrix.dockerfile }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # Railway builds these Dockerfiles from the repository root.
      matrix:
        dockerfile:
          - apps/collector-business-france/Dockerfile
          - apps/collector-wttj/Dockerfile
          - apps/collector-workday/Dockerfile
          - apps/discord-intake/Dockerfile
          - apps/discord-sender/Dockerfile
          - deploy/railway/nats/Dockerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build --file ${{ matrix.dockerfile }} .
