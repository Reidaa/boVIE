name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: 3.14
  PRE_COMMIT_HOME: ${{ github.workspace }}/.cache/pre-commit

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: latest
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Install pip
        run: uv pip install pip

      - name: Add virtualenv to PATH
        run: echo "$(pwd)/.venv/bin" >> $GITHUB_PATH

      - name: Cache pre-commit
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.PRE_COMMIT_HOME }}
          key: pre-commit-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-

      - name: Run pre-commit
        run: uv run --all-packages pre-commit run --all-files --show-diff-on-failure

  tests:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: bovie-test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      MYSQL_TEST_ADMIN_URL: mysql+pymysql://root:bovie-test-only@127.0.0.1:3306/mysql
      NATS_TEST_URL: nats://127.0.0.1:4222
      NATS_AUTH_TEST_URL: nats://127.0.0.1:4223

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv with caching
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Sync dependencies
        run: uv sync --all-packages

      - name: Run tests
        run: |
          docker run -d --name bovie-test-nats -p 127.0.0.1:4222:4222 nats:2.11-alpine --jetstream
          docker create --name bovie-test-nats-auth -p 127.0.0.1:4223:4222 -e NATS_ADMIN_PASSWORD=local-nats-admin -e NATS_BF_PASSWORD=local-nats-bf -e NATS_WTTJ_PASSWORD=local-nats-wttj -e NATS_NOTIFICATIONS_PASSWORD=local-nats-notifications nats:2.11-alpine --config /tmp/nats.conf
          docker cp deploy/nats.conf bovie-test-nats-auth:/tmp/nats.conf
          docker start bovie-test-nats-auth
          uv run --all-packages pytest

      - name: Check code and built artifacts
        run: |
          uv run --all-packages ruff check services packages tests scripts
          uv run --all-packages ty check
          uv build --all-packages --out-dir dist/workspace
          uv run --all-packages python scripts/check_packages.py dist/workspace
