---
repos:
  - repo: https://github.com/mpalmer/action-validator
    rev: v0.9.0
    hooks:
      - id: action-validator

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
        # pnpm-lock.yaml holds more than one YAML document.
        args: [--allow-multiple-documents]
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: biome-check
        name: biome check
        entry: pnpm exec biome check --no-errors-on-unmatched
        language: system
        types_or: [javascript, ts, json]
        require_serial: true
