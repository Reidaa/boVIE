[project]
name = "bovie-workspace"
version = "0.4.0"
description = "Job discovery and notification services"
requires-python = ">=3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/*", "packages/*"]

[tool.uv.sources]
bovie-business-france = { workspace = true }
bovie-wttj = { workspace = true }
bovie-outbox-relay = { workspace = true }
bovie-notification-intake = { workspace = true }
bovie-discord-delivery = { workspace = true }
bovie-broker-setup = { workspace = true }
bovie-contracts = { workspace = true }
bovie-database = { workspace = true }
bovie-source-store = { workspace = true }
bovie-notification-store = { workspace = true }
bovie-messaging = { workspace = true }
bovie-runtime = { workspace = true }

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.0.1",
    "ruff>=0.11.8",
    "ty>=0.0.1a1",
    "types-python-dateutil>=2.9.0.20241206",
]

[tool.ruff.lint]
extend-select = ["I"]
